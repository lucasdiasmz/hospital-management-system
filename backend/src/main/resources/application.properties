spring.application.name=hospital-vida

# Banco H2 em memoria (os dados sao recriados a cada execucao pelo DataLoader)
spring.datasource.url=jdbc:h2:mem:hospitalvida
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Console do H2: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:hospitalvida)
spring.h2.console.enabled=true

# Datas no formato ISO (ex.: 2026-10-20T14:30:00)
spring.jackson.serialization.write-dates-as-timestamps=false
# Parametros de URL com data, ex.: ?disponivelEm=2026-10-20T10:00
spring.mvc.format.date=iso
spring.mvc.format.date-time=iso
