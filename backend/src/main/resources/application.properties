spring.application.name=hospitalvida

# Banco em memória: os dados somem quando a aplicação para.
spring.datasource.url=jdbc:h2:mem:hospitalvida
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Console do banco em http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:hospitalvida)
spring.h2.console.enabled=true
