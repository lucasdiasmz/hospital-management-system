<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Profissional - Hospital Vida +</title>
  <link rel="stylesheet" href="cadastrarProfissional.css">
</head>
<body>

  <!-- Ícones (sprite SVG) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></symbol>
    <symbol id="i-brief" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5h6v2"/></symbol>
    <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
    <symbol id="i-bed" viewBox="0 0 24 24"><path d="M3 18V6M3 14h18v4M3 14v-3h8a3 3 0 0 1 3 3"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4-2v-4z"/></symbol>
  </svg>

  <div class="layout">

    <aside class="sidebar">
      <div class="logo"><svg class="ic"><use href="#i-plus"/></svg> Hospital Vida +</div>
      <ul class="nav">
        <li><a href="../../inicio/dashboard.html"><svg class="ic"><use href="#i-home"/></svg> Início</a></li>
        <li><a href="../../pacientes/pacientes.html"><svg class="ic"><use href="#i-user"/></svg> Pacientes</a></li>
        <li><a href="../../profissionais/profissionais.html" class="ativo"><svg class="ic"><use href="#i-brief"/></svg> Profissionais</a></li>
        <li><a href="#"><svg class="ic"><use href="#i-cal"/></svg> Consultas</a></li>
        <li><a href="#"><svg class="ic"><use href="#i-bed"/></svg> Internações</a></li>
        <li><a href="../../quartos/quartos.html"><svg class="ic"><use href="#i-bed"/></svg> Quartos</a></li>
        <li><a href="#"><svg class="ic"><use href="#i-clock"/></svg> Histórico</a></li>
      </ul>
    </aside>

    <div class="principal">
      <header class="topbar">
        <div class="busca">
          <svg class="ic"><use href="#i-search"/></svg>
          <input type="text" placeholder="Buscar...">
        </div>
        <div class="usuario">
          <span>Usuário</span>
          <div class="usuario__avatar"></div>
        </div>
      </header>

      <main class="conteudo">
        <div class="breadcrumb">Profissionais / Cadastrar</div>
        <h1>Cadastrar Profissional</h1>

        <form class="formulario" action="#" method="post">
          <div class="campo">
            <label for="nome">Nome *</label>
            <input type="text" id="nome" name="nome" placeholder="Digite o nome completo" required>
          </div>

          <div class="campo">
            <label for="registro">Registro profissional *</label>
            <input type="text" id="registro" name="registro" placeholder="Digite o registro" required>
          </div>

          <div class="campo">
            <label for="especialidade">Especialidade *</label>
            <select id="especialidade" name="especialidade" required>
              <option value="" selected disabled hidden>Selecione a especialidade</option>
              <option>Clínico Geral</option>
              <option>Cardiologia</option>
              <option>Ortopedia</option>
              <option>Pediatria</option>
            </select>
          </div>

          <div class="campo">
            <label for="telefone">Telefone *</label>
            <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
          </div>

          <div class="campo">
            <label for="email">E-mail *</label>
            <input type="email" id="email" name="email" placeholder="exemplo@dominio.com" required>
          </div>

          <div class="botoes">
            <a href="../profissionais.html" class="btn btn--cancelar">Cancelar</a>
            <button type="submit" class="btn btn--salvar">Salvar</button>
          </div>
        </form>
      </main>
    </div>

  </div>
</body>
</html>
